name: Deploy MkDocs to GitHub Pages
on:
  push:
    branches:
      - main  # 监听 main 分支的推送事件
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 依赖唯一来源是仓库根目录的 requirements.txt（与本地 conda 环境同一套 pip 包）。
    # nodejs 只供本地拉取前端库，构建不需要，故不在本文件中。
    - name: Install dependencies (from requirements.txt)
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    # 阶段 7 的发布验收：three 与场景用到 addons 都走 vendor 提交进仓库，
    # 一旦漏提交，站点就会在运行时 404（本地看不出来）。这里先卡一道。
    - name: Verify vendored three.js is present
      run: |
        test -f docs/javascripts/vendor/three/build/three.module.js
        test -f docs/javascripts/vendor/three/examples/jsm/controls/OrbitControls.js
        test -f docs/javascripts/vendor/three/examples/jsm/objects/Reflector.js
        test -f docs/javascripts/vendor/three/LICENSE
        echo "vendor OK: $(cat docs/javascripts/vendor/three/VERSION | head -1)"

    - name: Build the MkDocs site
      run: mkdocs build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
